<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3-5 우리반</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      color: #333;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }


    /* ─────────────
       상단
    ───────────── */

    header {
      background: white;
      border-radius: 25px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #777;
    }


    /* ─────────────
       D-DAY
    ───────────── */

    .dday {
      background: #8b7cff;
      color: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .dday h2 {
      margin-bottom: 15px;
    }

    .dday-list {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .dday-card {
      background: rgba(255,255,255,0.2);
      padding: 15px 20px;
      border-radius: 15px;
      flex: 1;
      min-width: 180px;
    }

    .dday-card strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
    }


    /* ─────────────
       카드
    ───────────── */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 20px;
    }


    /* ─────────────
       시간표 버튼
    ───────────── */

    .timetable-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .day-button {
      flex: 1;
      border: none;
      padding: 11px 5px;
      border-radius: 12px;
      background: #f0eefc;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .day-button:hover {
      background: #ddd9fa;
    }

    .day-button.active {
      background: #8b7cff;
      color: white;
    }


    /* ─────────────
       시간표
    ───────────── */

    #timetable .period {
      background: #f7f5ff;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .period-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .period-number {
      color: #888;
      font-size: 13px;
    }

    .subject {
      font-size: 17px;
      font-weight: bold;
    }

    .teacher {
      color: #999;
      font-size: 12px;
    }

    .changed {
      color: #8b7cff;
    }


    /* ─────────────
       급식
    ───────────── */

    .meal {
      background: #fff7e8;
      border-radius: 15px;
      padding: 18px;
      line-height: 2;
    }


    /* ─────────────
       일정
    ───────────── */

    .event {
      border-left: 4px solid #8b7cff;
      padding: 10px 15px;
      margin-bottom: 12px;
      background: #faf9ff;
      border-radius: 0 12px 12px 0;
    }

    .event strong {
      display: block;
      margin-bottom: 4px;
    }


    /* ─────────────
       모바일
    ───────────── */

    @media (max-width: 700px) {

      body {
        padding: 15px;
      }

      header h1 {
        font-size: 26px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .dday-list {
        flex-direction: column;
      }

    }

  </style>
</head>


<body>

<div class="container">


  <!-- ─────────────
       상단
  ───────────── -->

  <header>

    <h1>🏫 3-5 우리반</h1>

    <p>
      오늘도 즐거운 학교생활! ✨
    </p>

  </header>



  <!-- ─────────────
       D-DAY
  ───────────── -->

  <section class="dday">

    <h2>⏰ D-DAY</h2>

    <div class="dday-list">


      <div class="dday-card">

        📝 영어 수행평가

        <strong>D-3</strong>

      </div>


      <div class="dday-card">

        🏃 체육대회

        <strong>D-12</strong>

      </div>


      <div class="dday-card">

        🎓 졸업

        <strong>D-100</strong>

      </div>


    </div>

  </section>



  <!-- ─────────────
       카드 영역
  ───────────── -->

  <div class="grid">


    <!-- 시간표 -->

    <section class="card">

      <h2>📚 이번 주 시간표</h2>


      <div class="timetable-buttons">

        <button class="day-button" data-day="0">
          월
        </button>

        <button class="day-button" data-day="1">
          화
        </button>

        <button class="day-button" data-day="2">
          수
        </button>

        <button class="day-button" data-day="3">
          목
        </button>

        <button class="day-button" data-day="4">
          금
        </button>

      </div>


      <div id="timetable">

        📚 시간표를 불러오는 중...

      </div>

    </section>



    <!-- 급식 -->

    <section class="card">

      <h2>🍚 오늘의 급식</h2>

      <div class="meal">

        🍚 흰밥<br>
        🍲 김치찌개<br>
        🍗 치킨너겟<br>
        🥗 샐러드<br>
        🍎 후식

      </div>

    </section>



    <!-- 수행평가 -->

    <section class="card">

      <h2>📝 수행평가</h2>


      <div class="event">

        <strong>
          영어 말하기 수행평가
        </strong>

        8월 28일 · D-3

      </div>


      <div class="event">

        <strong>
          과학 실험 보고서
        </strong>

        9월 2일 · D-8

      </div>

    </section>



    <!-- 행사 -->

    <section class="card">

      <h2>🎉 우리반 일정</h2>


      <div class="event">

        <strong>
          🏃 체육대회
        </strong>

        9월 6일

      </div>


      <div class="event">

        <strong>
          🎒 현장체험학습
        </strong>

        10월 15일

      </div>

    </section>


  </div>

</div>



<!-- ═══════════════════════════════
     시간표 JavaScript
     ═══════════════════════════════ -->

<script>


/* ─────────────
   학교 정보
───────────── */

const API_URL =
  "https://holy-recipe-ee6e.sseoby0220.workers.dev";

const SCHOOL_NAME =
  "대전하기중학";

const GRADE = 3;

const CLASS_NO = 5;


/* 시간표 데이터 */

let timetableData = null;



/* ─────────────
   시간표 가져오기
───────────── */

async function loadTimetable() {

  const box =
    document.getElementById("timetable");


  box.innerHTML =
    "📚 시간표를 불러오는 중...";


  try {


    const url =
      API_URL +
      "?schoolname=" +
      encodeURIComponent(SCHOOL_NAME) +
      "&grade=" +
      GRADE +
      "&classno=" +
      CLASS_NO +
      "&week=0";


    console.log(
      "시간표 요청:",
      url
    );


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "API 오류 " +
        response.status
      );

    }


    timetableData =
      await response.json();


    console.log(
      "받은 시간표:",
      timetableData
    );


    /*
      오늘 요일 자동 선택

      자바스크립트:
      일요일 = 0
      월요일 = 1
      화요일 = 2
      ...
      금요일 = 5
    */

    let today =
      new Date().getDay() - 1;


    /*
      주말이면 월요일
    */

    if (
      today < 0 ||
      today > 4
    ) {

      today = 0;

    }


    showDay(today);


  } catch (error) {


    console.error(
      "시간표 오류:",
      error
    );


    box.innerHTML = `
      <p>
        😥 시간표를 불러오지 못했어요.
      </p>

      <small>
        ${error.message}
      </small>
    `;

  }

}



/* ─────────────
   요일 버튼
───────────── */

document
  .querySelectorAll(".day-button")
  .forEach(button => {


    button.addEventListener(
      "click",
      function() {


        const day =
          Number(
            this.dataset.day
          );


        console.log(
          "선택한 요일:",
          day
        );


        showDay(day);


      }
    );


  });



/* ─────────────
   선택한 요일 표시
───────────── */

function showDay(day) {


  const box =
    document.getElementById(
      "timetable"
    );


  /*
    아직 데이터를 못 받아왔다면
  */

  if (!timetableData) {

    box.innerHTML =
      "📚 시간표를 불러오는 중...";

    return;

  }



  /*
    선택한 버튼 활성화
  */

  document
    .querySelectorAll(".day-button")
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });


  const selectedButton =
    document.querySelector(
      `.day-button[data-day="${day}"]`
    );


  if (selectedButton) {

    selectedButton.classList.add(
      "active"
    );

  }



  /*
    해당 요일 시간표

    0 = 월
    1 = 화
    2 = 수
    3 = 목
    4 = 금
  */

  const lessons =
    timetableData.timetable[day];



  /*
    시간표가 없는 날
  */

  if (
    !lessons ||
    lessons.length === 0
  ) {

    box.innerHTML =
      "<p>이 날은 시간표가 없습니다.</p>";

    return;

  }



  /*
    시간표 만들기
  */

  box.innerHTML =
    lessons
      .map(lesson => {


        let subject =
          lesson.subject ||
          "수업 없음";


        let extra = "";



        /*
          변경된 수업
        */

        if (
          lesson.replaced
        ) {


          subject =
            "🔄 " +
            subject;



          if (
            lesson.original
          ) {


            extra = `
              <span class="teacher">
                원래:
                ${lesson.original.subject}
              </span>
            `;

          }

        }



        /*
          한 교시 만들기
        */

        return `

          <div class="period">

            <div class="period-info">


              <span class="period-number">

                ${lesson.period}교시

              </span>


              <span
                class="
                  subject
                  ${lesson.replaced
                    ? "changed"
                    : ""}
                "
              >

                ${subject}

              </span>


              <span class="teacher">

                ${lesson.teacher || ""}

              </span>


              ${extra}


            </div>

          </div>

        `;

      })
      .join("");

}



/* ─────────────
   시작
───────────── */

loadTimetable();


</script>


</body>
</html>
