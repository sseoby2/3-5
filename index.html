<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-5 우리반</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      color: #333;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    /* 상단 */
    header {
      background: white;
      border-radius: 25px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #777;
    }

    /* D-DAY */
    .dday {
      background: #8b7cff;
      color: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .dday h2 {
      margin-bottom: 15px;
    }

    .dday-list {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .dday-card {
      background: rgba(255,255,255,0.2);
      padding: 15px 20px;
      border-radius: 15px;
      flex: 1;
      min-width: 180px;
    }

    .dday-card strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
    }

    /* 카드 영역 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    /* 시간표 */
    .schedule {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .period {
      display: flex;
      justify-content: space-between;
      background: #f7f5ff;
      padding: 13px 16px;
      border-radius: 12px;
    }

    .period span:first-child {
      color: #777;
    }

    /* 급식 */
    .meal {
      background: #fff7e8;
      border-radius: 15px;
      padding: 18px;
      line-height: 2;
    }

    /* 일정 */
    .event {
      border-left: 4px solid #8b7cff;
      padding: 10px 15px;
      margin-bottom: 12px;
      background: #faf9ff;
      border-radius: 0 12px 12px 0;
    }

    .event strong {
      display: block;
      margin-bottom: 4px;
    }

    /* 모바일 */
    @media (max-width: 700px) {
      body {
        padding: 15px;
      }

      header h1 {
        font-size: 26px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .dday-list {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>🏫 3-5 우리반</h1>
    <p>오늘도 즐거운 학교생활! ✨</p>
  </header>

  <section class="dday">
    <h2>⏰ D-DAY</h2>

    <div class="dday-list">

      <div class="dday-card">
        📝 영어 수행평가
        <strong>D-3</strong>
      </div>

      <div class="dday-card">
        🏃 체육대회
        <strong>D-12</strong>
      </div>

      <div class="dday-card">
        🎓 졸업
        <strong>D-100</strong>
      </div>

    </div>
  </section>


  <div class="grid">

    <!-- 시간표 -->
    <section class="card">
      <h2>📚 오늘의 시간표</h2>

      <div class="schedule">

        <div class="period">
          <span>1교시</span>
          <strong>국어</strong>
        </div>

        <div class="period">
          <span>2교시</span>
          <strong>수학</strong>
        </div>

        <div class="period">
          <span>3교시</span>
          <strong>영어</strong>
        </div>

        <div class="period">
          <span>4교시</span>
          <strong>과학</strong>
        </div>

        <div class="period">
          <span>5교시</span>
          <strong>체육</strong>
        </div>

      </div>
    </section>


    <!-- 급식 -->
    <section class="card">
      <h2>🍚 오늘의 급식</h2>

      <div class="meal">
        🍚 흰밥<br>
        🍲 김치찌개<br>
        🍗 치킨너겟<br>
        🥗 샐러드<br>
        🍎 후식
      </div>
    </section>


    <!-- 수행평가 -->
    <section class="card">
      <h2>📝 수행평가</h2>

      <div class="event">
        <strong>영어 말하기 수행평가</strong>
        8월 28일 · D-3
      </div>

      <div class="event">
        <strong>과학 실험 보고서</strong>
        9월 2일 · D-8
      </div>

    </section>


    <!-- 행사 -->
    <section class="card">
      <h2>🎉 우리반 일정</h2>

      <div class="event">
        <strong>🏃 체육대회</strong>
        9월 6일
      </div>

      <div class="event">
        <strong>🎒 현장체험학습</strong>
        10월 15일
      </div>

    </section>

  </div>

</div>

</body>
</html>
